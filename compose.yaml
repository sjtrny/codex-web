services:
  codex-web:
    build: .
    user: "${CODEX_WEB_UID:-1000}:${CODEX_WEB_GID:-1000}"
    environment:
      CODEX_APP_SERVER_SOCKET: /run/codex/app.sock
      CODEX_DEFAULT_CWD: "${CODEX_DEFAULT_CWD:-/workspaces}"
      CODEX_WORKSPACE_ROOT: "${CODEX_WORKSPACE_ROOT:-/workspaces}"
      CODEX_DEFAULT_MODEL: "${CODEX_DEFAULT_MODEL:-gpt-5.6-terra}"
      CODEX_DEFAULT_REASONING_EFFORT: "${CODEX_DEFAULT_REASONING_EFFORT:-medium}"
      CODEX_DEFAULT_SERVICE_TIER: "${CODEX_DEFAULT_SERVICE_TIER:-}"
      CODEX_DEFAULT_PERSONALITY: "${CODEX_DEFAULT_PERSONALITY:-none}"
      CODEX_DEFAULT_REASONING_SUMMARY: "${CODEX_DEFAULT_REASONING_SUMMARY:-auto}"
      CODEX_DEFAULT_APPROVAL_POLICY: "${CODEX_DEFAULT_APPROVAL_POLICY:-on-request}"
      CODEX_DEFAULT_PERMISSION_PROFILE: "${CODEX_DEFAULT_PERMISSION_PROFILE:-:workspace}"
      CODEX_UPLOAD_DIR: /uploads
      CODEX_UPLOAD_HOST_DIR: "${CODEX_UPLOAD_HOST_DIR:-/workspaces/codex-web/uploads}"
      CODEX_UPLOAD_MAX_BYTES: "${CODEX_UPLOAD_MAX_BYTES:-52428800}"
      CODEX_UPLOAD_MAX_FILES: "${CODEX_UPLOAD_MAX_FILES:-12}"
      CODEX_UPLOAD_TOTAL_BYTES: "${CODEX_UPLOAD_TOTAL_BYTES:-209715200}"
    ports:
      - "0.0.0.0:${CODEX_WEB_PORT:-8765}:8000"
    volumes:
      - "${CODEX_RUNTIME_DIR:-./runtime}:/run/codex:ro"
      - "${CODEX_UPLOAD_STORAGE_DIR:-./uploads}:/uploads"
      - "${CODEX_WORKSPACE_HOST_PATH:-..}:${CODEX_WORKSPACE_ROOT:-/workspaces}:ro"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
